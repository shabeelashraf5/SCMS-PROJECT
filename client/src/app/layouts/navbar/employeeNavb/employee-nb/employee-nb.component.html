<nav class="border-gray-200 bg-black">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
  <a routerLink="/portal/dashboard" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="assets/22.png" class="h-12" alt="Flowbite Logo" />
      <!-- <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">Flowbite</span> -->
  </a>
  <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <!-- <button type="button" class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown" data-dropdown-placement="bottom">
        <span class="sr-only">Open user menu</span>
        <img class="w-8 h-8 rounded-full" [src]="employeeProfile ? getImageUrl(employeeProfile.image) : 'assets/dp.jpg'" alt="user photo">
      </button> -->
      <!-- Dropdown menu -->
      <div class="flex-none gap-2">
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
            <div class="w-10 rounded-full">
              <img
                alt="Tailwind CSS Navbar component" class="w-8 h-8 "
                [src]="employeeProfile ? getImageUrl(employeeProfile.image) : 'assets/dp.jpg'"
              />
            </div>
          </div>
          <ul
            tabindex="0"
            class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52"
          >
            <li>
              <a class="justify-between" routerLink="/portal/profile">
                Profile
                <span class="badge">New</span>
              </a>
            </li>
            <li class="text-[#FFFFFF]">
              <a
                rel="noopener noreferrer"
                (click)="logout()"
                class="flex items-center p-2 space-x-3 rounded-md hover:bg-base-100"
                style="cursor: pointer;"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 512 512"
                  class="w-5 h-5 fill-current text-gray-600"
                >
                  <path
                    d="M440,424V88H352V13.005L88,58.522V424H16v32h86.9L352,490.358V120h56V456h88V424ZM320,453.642,120,426.056V85.478L320,51Z"
                  ></path>
                  <rect width="32" height="64" x="256" y="232"></rect>
                </svg>
                <span>Logout</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      
      <button
  (click)="isNavbarOpen = !isNavbarOpen"
  type="button"
  class="inline-flex mr-2 items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
  aria-controls="navbar-default"
  [attr.aria-expanded]="isNavbarOpen"
>
  <span class="sr-only">Open main menu</span>
  <svg
    class="w-5 h-5"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 17 14"
  >
    <path
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M1 1h15M1 7h15M1 13h15"
    />
  </svg>
</button>
  </div>

  <div
      [class.hidden]="!isNavbarOpen"
      class="w-full md:block md:w-auto"
      id="navbar-default"
    >
    <ul
    class="font-medium mr-10 flex flex-col p-4 md:p-0 mt-4 md:mt-0 md:flex-row md:space-x-8 rtl:space-x-reverse bg-customPurple border border-customRed rounded-lg md:border-0 dark:border-gray-700"
  >
    <li>
      <a
        routerLink="/portal/sales"
        (click)="updateSidebar('Sales')"
        class="block text-lg py-2 px-3 rounded md:bg-transparent text-white md:p-0 hover:text-customRed bangers-regular hover:underline"
        aria-current="page"
      >Sales</a>
    </li>
    <li>
      <a
        routerLink="/portal/purchase"
        (click)="updateSidebar('Purchase')"
        class="block text-lg py-2 px-3 text-white rounded md:hover:bg-transparent md:border-0 md:p-0 dark:text-white hover:text-customRed md:dark:hover:bg-transparent bangers-regular hover:underline"
      >Purchase</a>
    </li>
    <li>
      <a
        routerLink="/portal/warehouse"
        (click)="updateSidebar('Warehouse')"
        class="block text-lg py-2 px-3 text-white rounded md:hover:bg-transparent md:border-0 md:p-0 dark:text-white hover:text-customRed md:dark:hover:bg-transparent bangers-regular hover:underline"
      >Warehouse</a>
    </li>
    <li>
      <a
        routerLink="/portal/shipment"
        (click)="updateSidebar('Shipment')"
        class="block text-lg py-2 px-3 text-white rounded md:hover:bg-transparent md:border-0 md:p-0 dark:text-white hover:text-customRed md:dark:hover:bg-transparent bangers-regular hover:underline"
      >Shipment</a>
    </li>
    <li>
      <a
        routerLink="/portal/accounting"
        (click)="updateSidebar('Accounting')"
        class="block text-lg py-2 px-3 text-white rounded md:hover:bg-transparent md:border-0 md:p-0 dark:text-white hover:text-customRed md:dark:hover:bg-transparent bangers-regular hover:underline"
      >Accounting</a>
    </li>
  </ul>
    </div>
  </div>
</nav>
