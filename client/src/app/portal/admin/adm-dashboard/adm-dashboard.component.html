<!-- Angular Component Template -->
<div class="container text-center text-white">
    <div class="row pt-5">
        <div class="col-lg-8 mx-auto">
            <h1 class="text-4xl">Angular add rows to table</h1>
            <p class="italic mb-0">Using Angular & Tailwind CSS, dynamically add and remove table rows.</p>
            <p class="italic">Snippet by
                <a class="text-white" href="https://bootstrapious.com/snippets">
                    <u>Bootstrapious</u>
                </a>
            </p>
        </div>
    </div>
</div>

<div class="container py-5">
    <div class="row">
        <div class="col-lg-7 mx-auto">
            <div class="card rounded-0 border-0 shadow">
                <div class="card-body p-5">
                    
                    <!--  Angular Table -->
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">First</th>
                                    <th scope="col">Last</th>
                                    <th scope="col">Handle</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let row of rows; let i = index">
                                    <th scope="row">{{ i + 1 }}</th>
                                    <td><input class="form-control rounded-0" type="text" [(ngModel)]="row.firstname" placeholder="First name"></td>
                                    <td><input class="form-control rounded-0" type="text" [(ngModel)]="row.lastname" placeholder="Last name"></td>
                                    <td><input class="form-control rounded-0" type="text" [(ngModel)]="row.handle" placeholder="Handle"></td>
                                    <td><button class="btn btn-danger rounded-0" (click)="deleteRow(i)"><i class="fa fa-trash"></i></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Add rows button-->
                    <button class="btn btn-primary rounded-0 btn-block" (click)="insertRow()">Add new row</button>
                </div>
            </div>
        </div>
    </div>
</div>
