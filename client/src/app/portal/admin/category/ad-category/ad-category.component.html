<app-admin-nb></app-admin-nb> 
<app-admin-sb></app-admin-sb>

<main class="w-full sm:w-3/4 p-4 ml-0 sm:ml-80 ">
  <!-- Your main content goes here -->
  <div class="form-control">
    <input type="text" placeholder="Search"  [(ngModel)]="searchTerm" class="input input-bordered w-24 md:w-auto" />
  </div>

  <!-- Open the modal using ID.showModal() method -->
  <button class="btn btn-outline mt-5" (click)="showModal()">Add</button>
  <dialog #my_modal_1 class="modal">
    <div class="modal-box">


      <form (ngSubmit)="onSubmit()"  #userForm="ngForm">
        <div class="form-group">
          <input type="text" name="category" [(ngModel)]="category" required placeholder="Category" class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
          <div *ngIf="userForm.controls['category']?.invalid && (userForm.controls['category']?.dirty || userForm.controls['category']?.touched)">
            <small class="text-red-500">Enter the Category</small>
          </div>
        </div>
      
        <div class="modal-action">
          <button type="submit" [disabled]="!userForm.form.valid" class="btn">Submit</button>
          <button type="button" class="btn" (click)="modal1.nativeElement.close()">Close</button>
        </div>
      </form>


      
    </div>
  </dialog>


  <div class="overflow-x-auto">
    <table class="table">
      <!-- head -->
      <thead>
        <tr>
          <th>
            
          </th>
          <th>Category</th>
          
          <th></th>
          <th></th>
          
        </tr>
      </thead>
      <tbody>
        <!-- row 1 -->
        <tr *ngFor="let category of getCurrentPageRecords() | async; let i = index">
          <th>
            {{ i + 1 }}
          </th>
          <td>
            <div class="flex items-center gap-3">
              <div>
                
                <div class="font-bold">{{category.category}}</div>
                
              </div>
            </div>
          </td>
       
          <th>
            <button class="btn btn-outline btn-success btn-xs" (click)="editCategories(category)">Update</button>
 <dialog #my_modal_2  class="modal">
  <div class="modal-box">
    <form  (submit)="editCategory(categoryToEdit)">
      <div class="form-group">
        <input type="text" name="category" id="category"  [(ngModel)]="categoryToEdit.category" placeholder="Category" class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
      </div>

      
      <div class="modal-action">
        <button type="submit" class="btn">Update</button>
        <button type="button" class="btn" (click)="modal2.nativeElement.close()">Close</button>
      </div>
    </form>
    
  </div>
</dialog>

          </th>
          <th>
            <button class="btn btn-outline btn-error btn-xs"  (click)="confirmDelete(category)" >delete</button>
          </th>
         
        </tr>
       
        
      </tbody>
      <!-- foot -->
      <tfoot>
        <tr>
          <th></th>
          <th>Category</th>
       
          <th></th>
          <th></th>
        </tr>
      </tfoot>
      
    </table>
  </div>

  <div class="pagination">
    <button class="btn" (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }}</span>
    <button class="btn" (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
  </div>


</main>
