<div class="flex flex-col lg:flex-row w-full h-screen bg-slate-100">
    <!-- Left Section -->
    <div class="grid h-screen w-full bg-slate-100 place-items-center">
      <div class="flex justify-center items-center">
        <img src="assets/222.png" alt="Logo" class="w-[350px] md:w-[500px]">
      </div>
    </div>
  
    <!-- Divider -->
    <div class="hidden lg:block divider divider-horizontal w-[0.5px] bg-slate-900"></div>
  
    <!-- Right Section -->
    <div class="grid h-screen w-full bg-slate-100 place-items-center px-4 sm:px-6 lg:px-12">
      <div class="flex flex-col w-full max-w-md p-6 rounded-md sm:p-10 mb-5 bg-slate-100 border border-slate-600 text-white">
        <div class="mb-8 text-center">
          <h1 class="my-3 text-3xl sm:text-4xl text-black font-bold">SCMS Portal</h1>
          <p class="text-sm sm:text-base text-gray-600">Sign in to access your account</p>
        </div>
        <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="space-y-12">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block mb-2 text-black text-sm">Email address</label>
                    <input type="email" formControlName="email" id="email" placeholder="leroy@jenkins.com"
                        class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
                </div>
                <div>
                    <div class="flex justify-between mb-2">
                        <label for="password" class="text-sm text-black">Password</label>
                        <a rel="noopener noreferrer" href="#" class="text-xs hover:underline text-white-600"></a>
                    </div>
                    <input type="password" formControlName="password" id="password" placeholder="*****"
                        class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
                </div>
            </div>
            <div class="space-y-2">
                <div>
                    <button type="submit"
                        class="w-full px-8 py-3 font-semibold bg-slate-900 rounded-md bg-[#FCFCFC] text-slate-100">Sign in</button>
                </div>
            </div>
        </form>
      </div>
    </div>
    <!-- <app-footer [backgroundColorClass]="'bg-black'"></app-footer> -->
  </div>
