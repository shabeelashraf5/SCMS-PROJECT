<div class="flex flex-col lg:flex-row w-full h-screen bg-slate-900 relative">
  <!-- Left Section -->
  <div class="grid h-screen w-full bg-slate-900 place-items-center">
    <div class="flex justify-center items-center">
      <img src="assets/2.png" alt="Logo" class="w-[350px] md:w-[500px]">
    </div>
  </div>

  <!-- Divider -->
  <div class="hidden lg:block divider divider-horizontal w-[0.5px] bg-slate-600"></div>

  <!-- Right Section -->
  <div class="grid h-screen w-full bg-slate-900 place-items-center px-4 sm:px-6 lg:px-12">
    <div class="flex flex-col w-full max-w-md p-6 rounded-md sm:p-10 mb-5 bg-slate-900 border border-slate-600 text-white">
      <div class="mb-8 text-center">
        <h1 class="my-3 text-3xl sm:text-4xl font-bold">SCMS Portal</h1>
        <p class="text-sm sm:text-base text-gray-600">Sign in to access your account</p>
      </div>
      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="space-y-8">
        <div class="space-y-4">
          <div>
            <label for="email" class="block mb-2 text-sm">Email address</label>
            <input type="email" formControlName="email" id="email" placeholder="leroy@jenkins.com"
                   class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
          </div>
          <div>
            <div class="flex justify-between mb-2">
              <label for="password" class="text-sm">Password</label>
            </div>
            <input type="password" formControlName="password" id="password" placeholder="*****"
                   class="w-full px-3 py-2 border rounded-md border-gray-300 bg-gray-50 text-gray-800">
          </div>
        </div>
        <div class="space-y-2">
          <div>
            <button type="submit" class="w-full px-8 py-3 font-semibold rounded-md bg-slate-900 border border-slate-600 text-gray-50">Sign in</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Guest Login Note -->
  <div class="absolute top-5 left-5 bg-slate-900 border-l-4 border-t border-b border-r-4 border-yellow-500 text-white p-4 rounded-md shadow-md">
    <h2 class="text-lg font-bold text-center">Guest Login</h2>
    <p class="text-sm text-center mt-2">Email: <span class="font-medium">{{email}}</span></p>
    <p class="text-sm text-center">Password: <span class="font-medium">{{password}}</span></p>
    <p class="text-xs text-gray-400 mt-2 italic">Use these credentials for a quick guest visit.</p>
  </div>
  <!-- <app-footer [backgroundColorClass]="'bg-black'"></app-footer> -->
</div>
