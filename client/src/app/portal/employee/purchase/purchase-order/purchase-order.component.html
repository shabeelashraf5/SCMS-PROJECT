<app-employee-nb></app-employee-nb> 
<app-employee-sb></app-employee-sb>


<main class="w-full sm:w-3/4 p-4 ml-0 sm:ml-80 ">



    <p class="mt-5 text-lg font-bold">Purchase Order</p>

      <div class="divider"></div> 

  

    
      <!-- Open the modal using ID.showModal() method -->
      
      
    
    
      <div class="overflow-x-auto">
        <table class="table">
          <!-- head -->
          <thead>
            <tr >
              <th>
                
              </th>
              <th>Your PO no</th>
              <th>Responsible</th>
              <th>Your Ref no</th>
              <th>Created At</th>
              <th>Status</th>
             
              
              <th></th>
          
              
            </tr>
          </thead>
          <tbody *ngIf="poDetails.length > 0">
            <!-- row 1 -->
            <tr  *ngFor="let detail of poDetails; trackBy: trackByPurchaseOrder" >
              <th>
                
              </th>
              <td>
                <div class="flex items-center gap-3">
                  <div>
                 
                    <div class="font-bold">
                      
                     <button (click)="getPurchaseDetail(detail._id)"> {{detail.po}} </button>
                    </div>
                    
                  </div>
                </div>
              </td>
              <td> {{getResponsible(detail)}} </td>
              <td>
                {{ getSrfq(detail.quotation_id) }}
                <br/>
              </td>
              <td> {{detail.createdAt | date: 'dd-MM-yyyy' }}</td>
              <td>{{detail.status}} </td>
              
              
              
            </tr>
                    
          </tbody>

          <tbody *ngIf="poDetails.length === 0">
            <tr>
              <td colspan="5" class="text-3xl text-center font-bold text-gray-600 h-20 ">
                No Data
              </td>
            </tr>
          </tbody>
          <!-- foot -->
          <tfoot>
            <tr>
              <th></th>
              <th>Your PO no</th>
              <th>Responsible</th>
              <th>Your Ref no</th>
              <th>Created At</th>
              <th>Status</th>
            
             
            </tr>
          </tfoot>
          
        </table>
      </div>
    
  







</main>
