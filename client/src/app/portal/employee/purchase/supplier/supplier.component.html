<app-employee-nb></app-employee-nb> 
<app-employee-sb></app-employee-sb>


<main class="w-full sm:w-3/4 p-4 ml-0 sm:ml-80 ">


 

      <p class="mt-10 text-lg font-bold">Supplier Directory</p>

      <div class="divider"></div> 
    
      <!-- Open the modal using ID.showModal() method -->
      
     
      <div class="overflow-x-auto">
        <table class="table">
          <!-- head -->
          <thead>
            <tr >
              <th>
                
              </th>
              <th>Supplier</th>
              <th>Email</th>
              <th>Contant</th>
              <th>Payment Method</th>
              
              <th></th>
              <th></th>
              
            </tr>
          </thead>
          <tbody *ngIf="supplierDetails.length > 0">
            <!-- row 1 -->
            <tr  *ngFor="let detail of supplierDetails; trackBy: trackBySupplier" >
              <th>
                
              </th>
              <td>
                <div class="flex items-center gap-3">
                  <div>
                {{detail.to}}
                  
                  </div>
                </div>
              </td>
              <td>
                {{detail.email}}
                <br/>
              </td>
              <td> {{detail.phone}}</td>
              <td> {{detail.payment}}</td>        
             
            </tr>
           
            
          </tbody>

          <tbody *ngIf="supplierDetails.length === 0">
            <tr>
              <td colspan="5" class="text-3xl text-center font-bold text-gray-600 h-20 ">
                No Data
              </td>
            </tr>
          </tbody>
          <!-- foot -->
          <tfoot>
            <tr>
              <th></th>
              <th>Supplier</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Paymend Method</th>
             
              <th></th>
              <th></th>
            </tr>
          </tfoot>
          
        </table>
      </div>
    
     









    
</main>
