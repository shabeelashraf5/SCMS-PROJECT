    <div class="p-4 bg-slate-900 min-h-screen">
      <div class="p-4 mt-14 relative">
    
        <p class="mt-10 text-2xl font-bold">Shipment History</p>
        <div class="divider"></div> 
    
        <label for="default-search" class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-white">Search</label>
        <div class="relative">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                </svg>
            </div>
            <input [(ngModel)]="searchQuery" (input)="filterEmployees()" type="search" id="default-search" class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search ..." required />
        </div>
    
    <div class="relative overflow-x-auto shadow-md border border-slate-600 sm:rounded-lg mt-5">
      <table class="w-full text-sm text-left rtl:text-right text-gray-200 ">
          <thead class="text-xs text-center text-gray-4 00 sm:rounded-lg uppercase bg-slate-900 border border-slate-600">
              <tr >
                  <th scope="col" class="px-6 py-3">
                    Shipment ID
                  </th>
                  <th scope="col" class="px-6 py-3">
                      Responsible
                  </th>
                  <th scope="col" class="px-6 py-3">
                    Client Name
                  </th>
                  <th scope="col" class="px-6 py-3">
                      Your Ref No
                  </th>
                  <th scope="col" class="px-6 py-3">
                    Invoice no
                </th>
                <th scope="col" class="px-6 py-3">
                  Delivery no
              </th>
              <th scope="col" class="px-6 py-3">
                Status
            </th>
            <th scope="col" class="px-6 py-3">
            
          </th>
              </tr>
          </thead>
          <tbody>
              <tr *ngFor="let detail of filteredEmployees | paginate: { itemsPerPage: itemsPerPage, currentPage: currentPage }; trackBy: trackByShipment"  class="text-center odd:bg-slate-800 even:bg-slate-900 border-b border-slate-600">
                  <th scope="row" class="px-6 py-4 font-medium text-gray-400 text-semibold whitespace-nowrap ">
                    <button  > {{detail.shipment}} </button>
                  </th>
                  <td class="px-6 py-4 text-gray-400">
                    {{getResponsible(detail)}}
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{ getClient(detail) }} 
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{ getClient(detail) }} 
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{ getRFQ(detail) }}  
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{ getInvoice(detail) }} 
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{ getDelivery(detail) }}  
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    {{detail.status}}  
                  </td>
                  <td class="px-6 py-4 text-gray-400">
                    <button class="btn btn-outline btn-error btn-xs"  [disabled]="confirmedDelivery.has(detail._id)"  (click)="confirmDelivery(detail._id)" >Confirm</button>
                  </td>
              </tr>
          </tbody>          
      </table>
    </div>
    </div>
    <pagination-controls (pageChange)="currentPage = $event"></pagination-controls>
    </div>
